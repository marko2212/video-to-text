name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.12 is the floor; 3.13 is what the owner runs (with audioop-lts).
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

  offline-engine:
    # The optional extra is not used by the tests above, so check separately
    # that it still installs from the lock file and imports.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies with the offline engine
        run: uv sync --locked --extra local

      - name: Import faster-whisper
        run: uv run --no-sync python -c "import faster_whisper"

      - name: Run tests with the Local engine available
        run: uv run --no-sync pytest -q
