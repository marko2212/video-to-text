[project]
name = "video-to-text"
version = "0.1.0"
description = "A simple app to convert video to text" # Optional
readme = "README.md" # Specifies the README file as the long description
authors = [
  { name="Marko Avramović", email="marko2212@gmail.com" },
]
license = "MIT"
requires-python = ">=3.12"

keywords = ["video", "audio", "transcription", "openai", "whisper", "ffmpeg", "streamlit"]

dependencies = [
    "streamlit==1.56.0",
    "python-dotenv==1.0.0",
    "ffmpeg-python==0.2.0",
    "pydub==0.25.1",
    "openai==1.75.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # pydub imports the stdlib `audioop` module, which was removed in Python 3.13
    # (PEP 594). audioop-lts is the official backport that pydub picks up via the
    # `pyaudioop` shim. Only needed on 3.13+.
    "audioop-lts>=0.2.1; python_version >= '3.13'",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Development Status :: 3 - Alpha"
]

[project.urls]
Homepage = "https://github.com/marko2212/video-to-text"
Repository = "https://github.com/marko2212/video-to-text"
Issues = "https://github.com/marko2212/video-to-text/issues" # Optional issue tracker link

# ==============================
# Tool Configuration
# ==============================

# This project is a Streamlit application, not an installable library,
# so tell uv to skip building/installing the project itself into the venv.
# uv will still resolve and install the declared dependencies.
[tool.uv]
package = false

[tool.ruff]
# Target the minimum supported interpreter so pyupgrade (UP) rewrites safely.
target-version = "py312"
line-length = 88
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "archive",
]

[tool.ruff.lint]
# See https://docs.astral.sh/ruff/rules/ for the full list.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes (unused imports/variables, undefined names)
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (potential bugs)
    "UP",  # pyupgrade (modern syntax, e.g. PEP 585/604 type hints)
    "A",   # flake8-builtins (shadowing builtins)
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "ANN", # flake8-annotations (require type hints)
    "D",   # pydocstyle (Google-style docstrings)
    "RUF", # ruff-specific good practices
    "PTH", # flake8-use-pathlib (prefer pathlib over os.path)
    "T20", # flake8-print (forbid print(); use logging)
    "S",   # flake8-bandit (basic security checks)
]
ignore = [
    "S603",   # subprocess call: ffmpeg is invoked with a fixed arg list, no shell
    "S607",   # partial executable path: ffmpeg is expected on the system PATH
    "ANN401", # `Any` is needed for duck-typed uploads, Pydantic context, **kwargs
    "RUF001", # ambiguous unicode in strings is intentional (UI: •, ℹ️, ·)
    "RUF002", # ambiguous unicode in docstrings is intentional
    "RUF003", # ambiguous unicode in comments is intentional
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Defaults are fine (double quotes, 4-space indent).
